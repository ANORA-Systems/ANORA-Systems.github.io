# Publishes the dev branch as a preview at https://johanneskoerner.github.io/anora-dev/.
# GitHub Pages serves one site per repo, so the preview lives in its own repo,
# JohannesKoerner/anora-dev, whose Pages builds its gh-pages branch. It sits in
# a personal account so it stays off the anora-systems.com domain.
# This workflow pushes there with a deploy key (secret DEV_PREVIEW_DEPLOY_KEY,
# write access on that repo only). Every preview page gets a noindex tag so
# search engines keep to anora-systems.com.

name: Deploy dev preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          python -m unittest discover -s _tests -v
          node --test

      - name: Prepare the preview
        run: |
          # CNAME claims anora-systems.com; the preview must not
          rm CNAME
          # keep search engines on anora-systems.com
          find . -name '*.html' -not -path './.git/*' -print0 |
            xargs -0 sed -i 's#<head>#<head>\n    <meta name="robots" content="noindex, nofollow">#'

      - name: Push to the preview repo
        # pinned to a commit: this step holds the deploy key, and a tag can move
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.DEV_PREVIEW_DEPLOY_KEY }}
          external_repository: JohannesKoerner/anora-dev
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
